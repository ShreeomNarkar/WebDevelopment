<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="main">
        <div class="sidebar">
            <h1><span style="color: #ab862f;">EMPLOYEE</span> REGISTERATION</h1>
        </div>
        <div class="right">
            <form action="">
                <div class="title">
                <h2>Tata Consultancy Services</h2>
                <img src="assets/tcs.png" alt="">
            </div>
                <input type="text" name="fullname" placeholder="First name">
                <input type="text" name="middlename" placeholder="Middle name">
                <input type="text" name="lastname" placeholder="Last name">
        
                <input type="file" name="profile" id="profile" title="Drop photo here">
                <input type="date" name="birthdate" id="birthdate">
                <input type="radio" name="gender" id="gender"> Male
                <input type="radio" name="gender" id="gender"> Female

                <input type="email" name="email" placeholder="Email">

                <input type="number" name="contact" placeholder="Contact">
                <input type="text" name="address" placeholder="Address">
                <input type="text" name="streetaddress" placeholder="Street address">


                <button> Checkout <img src="assets/right-arrow.png" height="15px" width="25px"></button>
            </form>
        </div>
    </div>
</body>

</html>
